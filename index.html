<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NEXORA - Liquid Glass</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow-x: hidden;
      position: relative;
    }

    /* Vidéo d'arrière-plan */
    .bg-video {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      z-index: -2;
    }

    /* Calque d'assombrissement léger pour garantir la lisibilité */
    .bg-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.25);
      z-index: -1;
    }

    /* --- EN-TÊTE / NAVIGATION --- */
    header {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      max-width: 1200px;
      z-index: 100;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 50px;
      padding: 12px 28px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
    }

    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .nav-left {
      display: flex;
      align-items: center;
      gap: 40px;
    }

    .logo {
      font-size: 1.3rem;
      font-weight: 800;
      color: #fff;
      text-decoration: none;
      letter-spacing: 1px;
    }

    .logo sup {
      font-size: 0.6rem;
    }

    .nav-links {
      display: flex;
      gap: 24px;
    }

    .nav-links a {
      color: rgba(255, 255, 255, 0.8);
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 500;
      transition: color 0.3s ease;
    }

    .nav-links a:hover {
      color: #ffffff;
    }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .login-link {
      color: rgba(255, 255, 255, 0.9);
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 500;
    }

    .btn-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 10px 22px;
      border-radius: 50px;
      font-size: 0.9rem;
      font-weight: 700;
      text-decoration: none;
      transition: all 0.3s ease;
    }

    .btn-try {
      background: rgba(0, 0, 0, 0.75);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(10px);
    }

    .btn-try:hover {
      background: #000;
      transform: scale(1.03);
    }

    /* --- SECTION HERO --- */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 160px 20px 60px 20px;
      max-width: 1000px;
      margin: 0 auto;
    }

    .hero-card {
      background: linear-gradient(
        135deg,
        rgba(255, 255, 255, 0.15),
        rgba(255, 255, 255, 0.03)
      );
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-top: 1px solid rgba(255, 255, 255, 0.5);
      border-left: 1px solid rgba(255, 255, 255, 0.5);
      border-radius: 32px;
      padding: 60px 40px;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.3),
                  inset 0 0 20px rgba(255, 255, 255, 0.15);
      width: 100%;
    }

    h1 {
      font-size: 3.8rem;
      font-weight: 800;
      line-height: 1.1;
      letter-spacing: -1px;
      margin-bottom: 20px;
      color: #ffffff;
      text-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
    }

    .hero-subtitle {
      font-size: 1.15rem;
      color: rgba(255, 255, 255, 0.85);
      max-width: 580px;
      margin: 0 auto 35px auto;
      line-height: 1.6;
    }

    .btn-cta {
      background: rgba(0, 0, 0, 0.85);
      color: #fff;
      padding: 14px 30px;
      font-size: 1rem;
      border: 1px solid rgba(255, 255, 255, 0.3);
      backdrop-filter: blur(10px);
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      gap: 8px;
    }

    .btn-cta:hover {
      background: #000;
      transform: translateY(-2px) scale(1.02);
      box-shadow: 0 15px 30px rgba(0,0,0,0.4), 0 0 15px rgba(255, 255, 255, 0.2);
    }

    /* --- SECTION LOGOS / PARTENAIRES --- */
    .trusted-section {
      width: 100%;
      margin-top: 50px;
      text-align: center;
    }

    .trusted-title {
      font-size: 0.85rem;
      color: rgba(255, 255, 255, 0.7);
      margin-bottom: 20px;
      letter-spacing: 0.5px;
    }

    .logos-bar {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      gap: 32px;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      border: 1px solid rgba(255, 255, 255, 0.18);
      padding: 16px 32px;
      border-radius: 50px;
    }

    .logo-item {
      font-weight: 700;
      font-size: 0.95rem;
      color: rgba(255, 255, 255, 0.85);
      letter-spacing: -0.5px;
    }

    /* Adaptations pour écrans mobiles */
    @media (max-width: 768px) {
      .nav-links { display: none; }
      h1 { font-size: 2.4rem; }
      .hero-card { padding: 40px 20px; }
      .logos-bar { gap: 18px; border-radius: 20px; }
    }
  </style>
</head>
<body>

  <!-- Vidéo en arrière-plan -->
  <video class="bg-video" autoplay loop muted playsinline>
    <source src="https://www.image2url.com/r2/default/videos/1790362329642-a7da7c29-29f9-4519-8ae3-f32331fa6022.mp4" type="video/mp4" />
  </video>
  <div class="bg-overlay"></div>

  <!-- Barre de Navigation -->
  <header>
    <nav>
      <div class="nav-left">
        <a href="#" class="logo">LIVRE<sup>®</sup></a>
        <div class="nav-links">
          <a href="#">Insights</a>
          <a href="#">Solutions</a>
          <a href="#">Pricing</a>
        </div>
      </div>
      <div class="nav-right">
        <a href="#" class="login-link">Login</a>
        <a href="#" class="btn-pill btn-try">Try Now</a>
      </div>
    </nav>
  </header>

  <!-- Contenu Principal (Hero) -->
  <main>
    <div>
      <h1>VOTRE LIVRE <br>VOTRE HISTOIRE.</h1>
      <p class="hero-subtitle">
        Decouvrez le livre que vous voulez. 
      </p>
      <a href="#" class="btn-pill btn-cta">
        commencé <span>↗</span>
      </a>
    </div>

    <!-- Partenaires / "Trusted by" -->
    <div class="trusted-section">
      <p class="trusted-title">Trusted by teams of every scale</p>
      <div class="logos-bar">
        <span class="logo-item">MERCURY</span>
        <span class="logo-item">ramp ↗</span>
        <span class="logo-item">HEX</span>
        <span class="logo-item">▲ Vercel</span>
        <span class="logo-item">descript</span>
        <span class="logo-item">$ Cash App</span>
        <span class="logo-item">SUPERCELL</span>
        <span class="logo-item">R runway</span>
      </div>
    </div>
  </main>

</body>
</html>
